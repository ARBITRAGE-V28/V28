<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA INTEGRATED SYSTEM</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg:#05070a;
    --panel:#0b0f17;
    --border:#141d2b;
    --accent:#00bcd4;
    --green:#2aa198;
    --text:#cbd5e1;
    --mono:'JetBrains Mono', monospace;
}

* { box-sizing:border-box; margin:0; padding:0; }

body {
    background:var(--bg);
    color:var(--text);
    font-family:var(--mono);
    height:100vh;
    overflow:hidden;
}

/* ================= LAYOUT ================ */
.shell {
    display:grid;
    grid-template-columns: 320px 1fr;
    height:100vh;
}

/* ================= CONTROL CENTER ================ */
.control {
    border-right:1px solid var(--border);
    background:var(--panel);
    padding:12px;
}

.btn {
    width:100%;
    padding:10px;
    margin-bottom:8px;
    background:transparent;
    border:1px solid var(--border);
    color:#64748b;
    cursor:pointer;
}

.btn:disabled {
    opacity:0.4;
    cursor:not-allowed;
}

/* ================= TERMINAL ================ */
.terminal {
    position:relative;
    overflow:hidden;
}

/* LOCK OVERLAY */
#lock {
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(12px);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:999;
    transition:0.3s;
}

.locked .terminal-content {
    filter:blur(10px);
    pointer-events:none;
}

.terminal-content {
    padding:20px;
}

/* fake terminal blocks */
.panel {
    background:var(--panel);
    border:1px solid var(--border);
    margin-bottom:10px;
    padding:10px;
}
</style>
</head>

<body>

<div class="shell">

<!-- ================= CONTROL CENTER ================= -->
<div class="control">

    <div style="margin-bottom:10px;color:var(--accent)">CONTROL CENTER</div>

    <button id="btn-wallet" class="btn" onclick="connectWallet()">1. Connect Wallet</button>
    <button id="btn-bot" class="btn" onclick="activateBot()" disabled>2. Activate Bot</button>
    <button id="btn-auth" class="btn" onclick="authorize()" disabled>3. Authorize Trading</button>

    <div style="margin-top:15px;font-size:11px">
        <div>Wallet: <span id="s-wallet">OFF</span></div>
        <div>Bot: <span id="s-bot">OFF</span></div>
        <div>Auth: <span id="s-auth">OFF</span></div>
    </div>

</div>

<!-- ================= TERMINAL ================= -->
<div class="terminal" id="terminal">

    <div id="lock">
        <div style="text-align:center">
            <div>SYSTEM LOCKED</div>
            <div style="opacity:0.6;font-size:11px;margin-top:10px">
                Complete Control Center sequence
            </div>
        </div>
    </div>

    <div class="terminal-content">

        <div class="panel">AURA TERMINAL CORE ACTIVE</div>
        <div class="panel">MARKET ENGINE INITIALIZED</div>
        <div class="panel">EXECUTION LAYER READY</div>

    </div>

</div>

</div>

<script>

/* ================= STATE ================= */
let state = {
    wallet:false,
    bot:false,
    auth:false
};

/* ================= SYNC ================= */
function sync(){
    localStorage.setItem("cc_wallet", state.wallet ? "1":"0");
    localStorage.setItem("cc_bot", state.bot ? "1":"0");
    localStorage.setItem("cc_auth", state.auth ? "1":"0");
    checkUnlock();
}

/* ================= UNLOCK LOGIC ================= */
function checkUnlock(){
    const w = localStorage.getItem("cc_wallet") === "1";
    const b = localStorage.getItem("cc_bot") === "1";
    const a = localStorage.getItem("cc_auth") === "1";

    const ready = w && b && a;

    const lock = document.getElementById("lock");

    if(ready){
        document.body.classList.remove("locked");
        lock.style.display = "none";
    } else {
        document.body.classList.add("locked");
        lock.style.display = "flex";
    }
}

/* ================= CONTROL CENTER ACTIONS ================= */
function connectWallet(){
    state.wallet = true;
    document.getElementById("btn-bot").disabled = false;
    document.getElementById("s-wallet").innerText = "ON";
    sync();
}

function activateBot(){
    state.bot = true;
    document.getElementById("btn-auth").disabled = false;
    document.getElementById("s-bot").innerText = "ON";
    sync();
}

function authorize(){
    state.auth = true;
    document.getElementById("s-auth").innerText = "ON";
    sync();
}

/* ================= INIT ================= */
setInterval(checkUnlock, 500);
checkUnlock();

</script>

</body>
</html>
