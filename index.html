<style>

    --bg:#05070a;

    --green:#2aa198;

*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font-ui);}

/* =========================
   LOCK OVERLAY (NEW)
========================= */
#boot-overlay{
    position:fixed;
    inset:0;
    background:rgba(5,7,10,0.92);
    backdrop-filter: blur(12px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:999999;
    transition:opacity .6s ease, transform .6s ease;
}

#boot-card{
    width:420px;
    border:1px solid var(--border);
    background:var(--panel);
    padding:18px;
    font-family:var(--font-mono);
    box-shadow:0 0 40px rgba(0,188,212,0.05);
    animation:floatIn .8s ease;
}

@keyframes floatIn{
    from{transform:translateY(20px);opacity:0;}
    to{transform:translateY(0);opacity:1;}
}

.boot-title{
    font-size:11px;
    letter-spacing:2px;
    color:var(--accent);
    margin-bottom:10px;
}

.boot-status{
    font-size:10px;
    color:var(--dim);
    line-height:1.6;
}

.glow{
    color:var(--accent);
    text-shadow:0 0 10px rgba(0,188,212,0.3);
}

/* =========================

========================= */

.btn-purple{color:#6366f1}
.btn-amber{color:#f59e0b}

.status-line{font-size:10px;margin-top:4px;color:var(--dim)}

/* =========================
   TERMINAL WRAPPER
========================= */
#terminal-wrapper{
    filter:blur(6px);
    pointer-events:none;
    transition:all .6s ease;
}

#terminal-wrapper.active{
    filter:none;
    pointer-events:auto;

    <div id="boot-card">
        <div class="boot-title">SYSTEM INITIALIZATION</div>
        <div class="boot-status">
            > Boot sequence pending<br>
            > Control Center required<br>
            > Authorization state: <span class="glow" id="boot-state">WAITING</span><br><br>

<script>
/* =========================
   GATING SYSTEM (NEW - NON-INTRUSIVE)
========================= */

let terminalUnlocked = false;

/* Capture window.onload from terminal script safely */
Object.defineProperty(window, 'onload', {
    set(fn){
        window.__terminalBoot = fn;
    },
    get(){
        return window.__terminalBoot;
    }
});

/* Watch authorization state */
const observer = new MutationObserver(() => {
    const el = document.getElementById('st-access');
    if(!el) return;

    if(el.innerText.includes("AUTHORIZED") && !terminalUnlocked){
        unlockTerminal();
    }
});

observer.observe(document.body, { childList:true, subtree:true, characterData:true });

function unlockTerminal(){
    terminalUnlocked = true;

    document.getElementById('boot-state').innerText = "AUTHORIZED";

    setTimeout(() => {
        document.getElementById('boot-overlay').style.opacity = "0";
        document.getElementById('boot-overlay').style.transform = "scale(1.05)";
    }, 800);

    setTimeout(() => {
        document.getElementById('boot-overlay').style.display = "none";
        document.getElementById('terminal-wrapper').classList.add('active');

        if(typeof window.__terminalBoot === "function"){
            window.__terminalBoot(); // start terminal ONLY now
        }
    }, 1400);
}
</script>
