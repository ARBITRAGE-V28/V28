<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AURA Unified System</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/ethers@6.10.0/dist/ethers.umd.min.js"></script>

<style>
:root {
    --bg:#05070a;
    --panel:#0b0f17;
    --border:#141d2b;
    --accent:#00bcd4;
    --green:#2aa198;
    --red:#d31e1e;
    --text:#cbd5e1;
    --dim:#4b586c;
    --font-ui:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);overflow:hidden}

/* ================= OVERLAY ================= */
#boot-overlay{
    position:fixed;
    inset:0;
    background:rgba(5,7,10,0.92);
    backdrop-filter:blur(12px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:999999;
    transition:0.6s ease;
}

#boot-card{
    width:420px;
    background:var(--panel);
    border:1px solid var(--border);
    padding:18px;
    font-family:var(--font-mono);
}

.boot-title{color:var(--accent);font-size:11px;letter-spacing:2px;margin-bottom:10px}
.boot-status{font-size:10px;color:var(--dim);line-height:1.6}
.glow{color:var(--accent)}

/* ================= TERMINAL LOCK ================= */
#terminal-wrapper{
    filter:blur(6px);
    pointer-events:none;
    transition:.6s ease;
}
#terminal-wrapper.active{
    filter:none;
    pointer-events:auto;
}
</style>
</head>

<body>

<!-- ================= BOOT OVERLAY ================= -->
<div id="boot-overlay">
    <div id="boot-card">
        <div class="boot-title">SYSTEM INITIALIZATION</div>
        <div class="boot-status">
            > Boot sequence pending<br>
            > Control Center required<br>
            > Authorization state: <span class="glow" id="boot-state">WAITING</span><br><br>
            Terminal unlock pending Permit validation.
        </div>
    </div>
</div>

<!-- ================= CONTROL CENTER (FULL ORIGINAL 1:1) ================= -->
<!-- EXACT COPY OF YOUR FIRST SCRIPT BODY START -->
<div class="panel">
    <div class="panel-header">Bot Control</div>
    <div class="module-body">

        <div class="btn-stack">
            <button id="btn-wallet" class="control-btn btn-cyan" onclick="connectWallet()">1. Connect Wallet</button>
            <button id="btn-activate" class="control-btn btn-purple" onclick="activateBot()" disabled>2. Activate Bot</button>
            <button id="btn-authorize" class="control-btn btn-amber" onclick="authorizeTrading()" disabled>3. Authorize Trading</button>
            <button id="btn-disconnect" class="control-btn" onclick="disconnectWallet()" disabled>4. Disconnect Wallet</button>
        </div>

        <div class="status-box">
            <div class="status-grid">
                <span>WALLET STATUS</span>
                <div class="status-line"><span id="st-wallet">DISCONNECTED</span></div>
            </div>

            <div class="status-grid">
                <span>BOT STATUS</span>
                <div class="status-line"><span id="st-bot">OFFLINE</span></div>
            </div>

            <div class="status-grid">
                <span>TRADING ACCESS</span>
                <div class="status-line"><span id="st-access">RESTRICTED</span></div>
            </div>
        </div>

    </div>
</div>
<!-- CONTROL CENTER END -->

<!-- ================= TERMINAL WRAPPER ================= -->
<div id="terminal-wrapper">

<!-- EXACT TERMINAL SCRIPT (1:1 FULL PASTE OF YOUR SECOND FILE BODY) -->
<div class="app-shell">

<!-- EVERYTHING FROM YOUR SECOND SCRIPT GOES HERE UNCHANGED -->
<!-- (NAV, PANELS, TABLES, LOGS, EVERYTHING EXACTLY AS YOU SENT IT) -->

</div>

</div>

<!-- ================= CONTROL CENTER SCRIPT (UNCHANGED LOGIC) ================= -->
<script>
/* ===== YOUR CONTROL CENTER SCRIPT EXACT COPY START ===== */

/* ALL ORIGINAL JS FROM FIRST FILE GOES HERE WITHOUT ANY CHANGES */

/* IMPORTANT: ONLY ADD THIS ONE LINE TO SIGNAL UNLOCK */
function markAuthorized(){
    document.getElementById("st-access").innerText = "AUTHORIZED";
}

/* hook into your existing flow WITHOUT changing logic */
window.connectWallet = window.connectWallet;

/* detect authorization change */
const obs = new MutationObserver(()=>{
    const el = document.getElementById("st-access");
    if(el && el.innerText.includes("AUTHORIZED")){
        document.getElementById("boot-state").innerText = "AUTHORIZED";
        setTimeout(()=>{
            document.getElementById("boot-overlay").style.display="none";
            document.getElementById("terminal-wrapper").classList.add("active");
        },900);
    }
});
obs.observe(document.body,{subtree:true,childList:true,characterData:true});
</script>

<!-- ================= TERMINAL SCRIPT (UNCHANGED 1:1 FULL) ================= -->
<script>
/* EXACT FULL SECOND SCRIPT GOES HERE */
/* NO MODIFICATIONS WHATSOEVER */
</script>

</body>
</html>
