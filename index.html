<style>
:root {
    --bg: #05070a;
    --panel: #0b0f17;
    --border: #141d2b;

    --accent: #00bcd4;
    --green: #2aa198;
    --red: #d31e1e;

    --text-main: #cbd5e1;
    --text-dim: #4b586c;

    --font-ui: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
}

/* RESET (AURA STYLE MINIMAL OVERRIDE) */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: var(--bg);
    color: var(--text-main);
    font-family: var(--font-ui);
    padding: 12px;
}

/* PANEL SYSTEM (mapping op jouw .panel) */
.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    margin-bottom: 12px;
}

/* HEADER BAR */
.panel-header {
    background: rgba(0,0,0,0.25);
    padding: 10px 14px;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #5d6e85;
    border-bottom: 1px solid #080c12;
}

/* CONTENT */
.module-body {
    padding: 12px 15px;
}

/* BUTTON STACK */
.btn-stack {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
}

/* CONTROL BUTTONS */
.control-btn {
    background: #0f1420;
    border: 1px solid #1a2638;
    color: #718096;
    padding: 10px;
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
}

.control-btn:hover {
    background: #172033;
    color: #fff;
}

.control-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

/* STATUS BOX */
.status-box {
    border-top: 1px solid #141d2b;
    padding-top: 10px;
}

.status-grid {
    display: grid;
    grid-template-columns: 1fr 110px;
    gap: 6px;
    font-size: 10px;
    align-items: center;
    margin-bottom: 6px;
    color: #5d6e85;
}

.status-line {
    display: flex;
    align-items: center;
    gap: 8px;
}

.liveDot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
}

/* DOT COLORS */
#dot-wallet, #dot-bot, #dot-access {
    background: #475569;
}

/* EXECUTION CONSOLE */
#execution-console {
    display: flex;
    flex-direction: column;
    padding: 10px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: #a0aec0;
}

.exec-line {
    font-size: 10px;
    padding: 4px 0;
    border-bottom: 1px solid #080c12;
    word-break: break-word;
}

/* STATUS COLORS OVERRIDE (AURA STYLE) */
.btn-cyan { color: var(--accent); }
.btn-purple { color: #7c83ff; }
.btn-amber { color: #f59e0b; }

/* SCROLL CLEAN */
body {
    overflow-x: hidden;
}
</style>
