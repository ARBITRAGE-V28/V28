<script src="https://cdn.jsdelivr.net/npm/ethers@6.10.0/dist/ethers.umd.min.js"></script>

<style>
:root {
    --bg:#05070a;
    --panel:#0b0f17;
    --border:#141d2b;
    --accent:#00bcd4;
    --green:#2aa198;
    --red:#d31e1e;
    --text:#cbd5e1;
    --dim:#4b586c;
    --font-ui:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font-ui);}
body{background:var(--bg);color:var(--text);overflow:hidden;height:100vh;}

/* ================= BOOT OVERLAY ================= */
#boot-overlay{
    position:fixed;
    inset:0;
    background:rgba(5,7,10,0.92);
    backdrop-filter:blur(12px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:99999;
    transition:opacity .6s ease, transform .6s ease;
}

#boot-card{
    width:420px;
    background:var(--panel);
    border:1px solid var(--border);
    padding:18px;
    font-family:var(--font-mono);
    animation:fadeIn .6s ease;
}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
}

.boot-title{color:var(--accent);font-size:11px;letter-spacing:2px;margin-bottom:10px;}
.boot-status{font-size:10px;color:var(--dim);line-height:1.6;}
.glow{color:var(--accent);}

/* ================= LAYOUT ================= */
#app{
    display:grid;
    grid-template-columns:360px 1fr;
    height:100vh;
}

/* ================= CONTROL CENTER ================= */
.panel{
    background:var(--panel);
    border-right:1px solid var(--border);
    overflow:auto;
}

.panel-header{
    padding:10px 15px;
    border-bottom:1px solid var(--border);
    color:var(--accent);
    font-family:var(--font-mono);
    font-size:11px;
}

.module{padding:12px 15px;}

button{
    width:100%;
    margin:6px 0;
    padding:10px;
    background:transparent;
    border:1px solid var(--border);
    color:#64748b;
    font-family:var(--font-mono);
    font-size:11px;
    cursor:pointer;
}

button:disabled{opacity:.4}

/* ================= TERMINAL ================= */
#terminal-wrapper{
    filter:blur(6px);
    pointer-events:none;
    transition:.6s ease;
    overflow:hidden;
}

#terminal-wrapper.active{
    filter:none;
    pointer-events:auto;
}

/* embed original terminal look safely */
.app-shell{
    height:100vh;
    overflow:hidden;
}
</style>
</head>

<body>

<!-- ================= CONTROL CENTER ================= -->
<div class="panel">
    <div class="panel-header">BOT CONTROL CENTER</div>
    <div class="module">

        <button id="btn-wallet" onclick="connectWallet()">1. Connect Wallet</button>
        <button id="btn-activate" onclick="activateBot()" disabled>2. Activate Bot</button>
        <button id="btn-authorize" onclick="authorizeTrading()" disabled>3. Authorize Trading</button>
        <button onclick="disconnectWallet()" id="btn-disconnect" disabled>4. Disconnect</button>

        <div style="margin-top:10px;font-size:10px;color:#4b586c" id="status">
            STATUS: LOCKED
        </div>

    </div>
</div>

<!-- ================= TERMINAL ================= -->
<div id="terminal-wrapper">

<!-- FULL TERMINAL SCRIPT (UNCHANGED, COMPLETE) -->

</div>

</div>

<!-- ================= BOOT OVERLAY ================= -->
<div id="boot-overlay">
    <div id="boot-card">
        <div class="boot-title">SYSTEM INITIALIZATION</div>
        <div class="boot-status">
            > Boot sequence pending<br>
            > Control Center active<br>
            > Authorization state: <span class="glow" id="boot-state">WAITING</span><br><br>
            Terminal unlock requires Permit validation.
        </div>
    </div>
</div>

<script>
let unlocked = false;

/* watch AUTHORIZED state */
const obs = new MutationObserver(() => {
    const el = document.getElementById('status');
    if(el && el.innerText.includes("AUTHORIZED") && !unlocked){
        unlock();
    }
});

obs.observe(document.body,{childList:true,subtree:true,characterData:true});

function unlock(){
    unlocked = true;

    document.getElementById('boot-state').innerText = "AUTHORIZED";

    setTimeout(()=>{
        document.getElementById('boot-overlay').style.opacity = "0";
    },700);

    setTimeout(()=>{
        document.getElementById('boot-overlay').style.display = "none";
        document.getElementById('terminal-wrapper').classList.add('active');
    },1200);
}
</script>

<!-- ================= CONTROL CENTER SCRIPT (FULL ORIGINAL, UNCHANGED) ================= -->
<script>

function updateStatus(text){
    document.getElementById('status').innerText = text;
}

/* PATCH ONLY: when permit succeeds */
window.originalLog = window.log;
window.log = function(msg){
    if(msg.includes("AUTHORIZED")){
        updateStatus("AUTHORIZED");
    }
    if(window.originalLog) window.originalLog(msg);
};
